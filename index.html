<html>

<head>
    <link rel="stylesheet" href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css"
        type="text/css" />
    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>
    <script type='text/javascript'>
        const STORAGE_ACCOUNT_NAME = "vguuiootstorageeeeeee";
        const CONTAINER_NAME = "gps-container";
        const SUBSCRIPTION_KEY = "__SUBSCRIPTION_KEY__";

        var map;

        function init() {
            const listUrl = `https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${CONTAINER_NAME}/?restype=container&comp=list`;

            fetch(listUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.text();
                })
                .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
                .then(xml => {
                    const blobUrls = Array.from(xml.querySelectorAll("Url")).map(node => node.textContent);
                    return Promise.all(blobUrls.map(url => loadJSON(url)));
                })
                .then(features => {
                    const validFeatures = features.filter(Boolean);

                    map = new atlas.Map('myMap', {
                        center: [-122.26473, 47.73444],
                        zoom: 14,
                        authOptions: {
                            authType: "subscriptionKey",
                            subscriptionKey: SUBSCRIPTION_KEY
                        }
                    });

                    map.events.add('ready', function () {
                        var source = new atlas.source.DataSource();
                        map.sources.add(source);
                        map.layers.add(new atlas.layer.BubbleLayer(source));
                        source.add(validFeatures);

                        if (validFeatures.length > 0) {
                            const bounds = atlas.data.BoundingBox.fromData(validFeatures);
                            map.setCamera({ bounds: bounds, padding: 50 });
                        }
                    });
                })
                .catch(err => console.error("Lỗi tải dữ liệu bản đồ:", err));
        }

        function loadJSON(fileUrl) {
            return fetch(fileUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then(gps => {
                    return new atlas.data.Feature(
                        new atlas.data.Point([parseFloat(gps.gps.lon), parseFloat(gps.gps.lat)])
                    );
                });
        }
    </script>
    <style>
        html, body, #myMap {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body onload="init()">
    <div id="myMap"></div>
</body>

</html>
